name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          bin=querywise
          dir=querywise_${{ github.ref_name }}_${{ matrix.target }}
          mkdir "$dir"
          cp "target/${{ matrix.target }}/release/$bin" "$dir/"
          cp README.md LICENSE "$dir/" 2>/dev/null || true
          tar -czf "$dir.tar.gz" "$dir"
      - name: Package (windows)
        if: runner.os == 'Windows'
        run: |
          $dir = "querywise_${{ github.ref_name }}_${{ matrix.target }}"
          New-Item -ItemType Directory -Path $dir | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/querywise.exe" $dir
          Copy-Item README.md, LICENSE $dir -ErrorAction SilentlyContinue
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            querywise_*.tar.gz
            querywise_*.zip
